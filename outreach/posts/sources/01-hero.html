<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Frank+Ruhl+Libre:wght@700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:1200px; background:#0a0908; color:#f8f4ea; font-family:'Inter',sans-serif;
         display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
  body::before { content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 30%, rgba(154,24,24,0.15) 0%, transparent 55%); }
  .top { padding:90px 70px 20px; text-align:center; direction:rtl; position:relative; z-index:1; }
  .hook { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:120px; color:#f8f4ea; line-height:1; letter-spacing:-0.02em; direction:rtl; }
  .sub-hook { font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:52px; color:#a89e94; line-height:1.1; margin-top:28px; direction:rtl; }
  .middle { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 70px; position:relative; z-index:1; direction:rtl; text-align:center; }
  .proof-line { font-family:'IBM Plex Mono',monospace; font-size:16px; letter-spacing:0.24em; color:#9a1818; text-transform:uppercase; margin-bottom:18px; direction:ltr; }
  .proof { display:flex; justify-content:center; align-items:baseline; gap:36px; direction:ltr; margin-bottom:22px; }
  .proof .was { font-family:'Playfair Display',serif; font-weight:900; font-size:130px; color:#a89e94; opacity:0.55; letter-spacing:-0.02em; text-decoration:line-through; text-decoration-color:#9a1818; text-decoration-thickness:4px; }
  .proof .arrow { font-family:'Playfair Display',serif; font-size:110px; color:#a89e94; }
  .proof .now { font-family:'Playfair Display',serif; font-weight:900; font-size:220px; color:#9a1818; letter-spacing:-0.03em;
                text-shadow: 0 2px 60px rgba(154,24,24,0.4); line-height:0.9; }
  .proof-labels { display:flex; justify-content:center; gap:150px; direction:ltr; font-family:'IBM Plex Mono',monospace; font-size:16px; letter-spacing:0.2em; color:#a89e94; text-transform:uppercase; margin-bottom:30px; }
  .explain { font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:34px; color:#e8d8c0; line-height:1.3; max-width:900px; margin:0 auto; font-style:italic; direction:rtl; }
  .act { background:#9a1818; padding:34px 40px; text-align:center; direction:rtl; position:relative; z-index:2; }
  .act .label { font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.4em; color:rgba(255,255,255,0.75); text-transform:uppercase; margin-bottom:10px; direction:ltr; }
  .act .cta { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:52px; color:#ffffff; line-height:1.1; direction:rtl; }
  .meta { padding:16px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:#70645c; letter-spacing:0.2em; text-transform:uppercase; background:#06050a; direction:ltr; }
</style></head>
<body>
<div class="top">
  <div class="hook">אתה לא מטורף.</div>
  <div class="sub-hook">7 מיליון ישראלים מרגישים את זה גם.</div>
</div>
<div class="middle">
  <div class="proof-line">The state function · F</div>
  <div class="proof">
    <div class="was">100</div>
    <div class="arrow">→</div>
    <div class="now">0.6</div>
  </div>
  <div class="proof-labels"><div>1948</div><div>2026</div></div>
  <div class="explain">ככה המדינה בה הורייך גדלו<br>משווה למדינה בה אתה חי היום.</div>
</div>
<div class="act">
  <div class="label">1 / 7  ·  Share this</div>
  <div class="cta">תייג מישהו שמרגיש את זה כבר שנים.</div>
</div>
<div class="meta">E.N.H.  ·  125,000 points  ·  40 sources  ·  MIT  ·  hemligroups.github.io/israel-fractal-site</div>
</body></html>
