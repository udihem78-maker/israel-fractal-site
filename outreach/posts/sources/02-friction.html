<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:1200px; background:#0a0908; color:#f8f4ea; font-family:'Inter',sans-serif;
         display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; overflow:hidden; }
  body::before { content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 10%, rgba(154,24,24,0.18) 0%, transparent 50%); }
  .wrap { position:relative; z-index:1; text-align:center; max-width:960px; }
  .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.3em; color:#a89e94; text-transform:uppercase; margin-bottom:60px; }
  .big { font-family:'Playfair Display',serif; font-weight:900; font-size:360px; color:#9a1818; line-height:1; letter-spacing:-0.03em;
         text-shadow: 0 2px 60px rgba(154,24,24,0.4); }
  .big .x { font-size:200px; vertical-align:middle; opacity:0.85; }
  .arrow { color:#9a1818; font-size:200px; vertical-align:middle; }
  .caption { font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.18em; color:#f8f4ea; text-transform:uppercase; margin-top:48px; opacity:0.95; }
  .rule { width:88px; height:1px; background:#3f6013; margin:40px auto; }
  .quote { font-family:'Playfair Display',serif; font-size:38px; color:#e8d8c0; line-height:1.3; max-width:780px; margin:0 auto; font-style:italic; font-weight:400; }
  .foot { position:absolute; bottom:48px; left:0; right:0; text-align:center;
          font-family:'IBM Plex Mono',monospace; font-size:14px; color:#70645c; letter-spacing:0.14em; text-transform:uppercase; z-index:1; }
</style></head>
<body>
<div class="wrap">
  <div class="eyebrow">Friction · R · 1948 → 2026</div>
  <div class="big"><span class="arrow">↑</span>232<span class="x">×</span></div>
  <div class="caption">The bureaucracy, not the budget</div>
  <div class="rule"></div>
  <div class="quote">Decisions are made. They don't reach citizens.</div>
</div>
<div class="foot">E.N.H.  ·  Hemli Principle  ·  Falsifiable by design</div>
</body></html>
