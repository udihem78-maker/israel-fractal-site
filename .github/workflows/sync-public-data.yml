name: Refresh public directory

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: public-directory-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the data transformation
        run: python3 -m unittest discover -s tests -v
      - name: Fetch, validate and preserve provenance
        run: python3 scripts/sync_public_data.py
      - name: Validate the resulting snapshot
        run: python3 -m unittest discover -s tests -v
      - name: Publish only validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh source-labeled public directory"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated snapshot to Pages
        id: deployment
        uses: actions/deploy-pages@v4
